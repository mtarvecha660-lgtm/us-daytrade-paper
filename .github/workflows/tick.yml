name: tick

# Runs the US day-trade PAPER bot (virtual money only, no broker, no orders) about every 5 minutes during US
# market hours (9:30 AM-4:00 PM ET = 8:00 PM-2:30 AM IST in winter), commits the account's state and
# republishes the dashboard on GitHub Pages.
# Stop it any time: Actions tab -> tick -> "..." -> Disable workflow.

on:
  schedule:
    # every 5 min, weekdays 13:00-21:59 UTC (covers 9:30-16:00 ET in both winter and summer time).
    # The bot itself checks the NYSE calendar, so holidays and pre-/after-hours runs do nothing.
    - cron: "2-57/5 13-21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write     # commit the paper account's state
  actions: write      # the backup ticker starts the next run
  pages: write        # publish the dashboard
  id-token: write

concurrency:
  group: tick         # never two ticks at once; a new one waits for the running one
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Note start time
        run: echo "TICK_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Paper tick (virtual money)
        id: tick
        run: python live/tick.py

      - name: Commit paper state
        if: always()      # commit what succeeded even when the tick failed
        run: |
          git config user.name  "paper-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live/state docs/data
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -q -m "paper tick $(date -u +'%Y-%m-%d %H:%M') UTC [skip ci]"
          for i in 1 2 3; do
            git pull -q --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push failed, retrying ($i)"; sleep $((i * 5))
          done
          exit 1

      - uses: actions/configure-pages@v6
        if: always()
        continue-on-error: true   # a dashboard hiccup never stops the bot

      - uses: actions/upload-pages-artifact@v5
        if: always()
        continue-on-error: true
        with:
          path: docs

      - id: deploy
        if: always()
        continue-on-error: true
        uses: actions/deploy-pages@v5

      # The chain. GitHub's cron is unreliable (it never fired on the sister BTC repo, and a single stray cron run once
      # switched that repo's backup off for 2.5 h), so the bot NEVER depends on cron; cron above is only a bonus.
      # Each run starts the next one itself (workflow_dispatch):
      #   market hours: ~5 min after this run began;
      #   off hours:    this run sleeps (at most 5.5 h, under GitHub's 6 h job limit) toward 5 min before the next
      #                 NYSE open (skill calendar: weekends and holidays included), then starts the next run, which
      #                 sleeps again if the open is still far. That is how it restarts every morning without cron.
      # Just before dispatching it checks whether ANOTHER run of this workflow created after this run began is still
      # queued or in progress (e.g. a cron run waiting behind this one): if so, that run carries the chain and this
      # one stops, so there is only ever one chain. A finished or cancelled cron run never switches the chain off.
      - name: Chain - start the next run (sleeps outside market hours)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          plan=$(python live/schedule.py); echo "$plan"
          mode=$(echo "$plan" | python -c 'import json,sys;print(json.load(sys.stdin)["mode"])')
          wait_s=$(echo "$plan" | python -c 'import json,sys;print(json.load(sys.stdin)["wait"])')
          me_created=$(gh run view "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" --json createdAt -q .createdAt 2>/dev/null || date -u -d "@$TICK_START" +%Y-%m-%dT%H:%M:%SZ)
          echo "mode=$mode: waiting ${wait_s}s"; sleep "$wait_s"
          alive=$(gh run list -R "$GITHUB_REPOSITORY" --workflow tick.yml --limit 30 --json databaseId,status,createdAt \
            -q "[.[] | select(.databaseId != ${GITHUB_RUN_ID} and .createdAt > \"${me_created}\" and (.status==\"queued\" or .status==\"pending\" or .status==\"waiting\" or .status==\"requested\" or .status==\"in_progress\"))] | length" 2>/dev/null || echo 0)
          if [ "${alive:-0}" != "0" ]; then echo "$alive newer run(s) already queued/running; they carry the chain"; exit 0; fi
          for i in 1 2 3; do
            gh workflow run tick.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" && { echo "started the next run"; exit 0; }
            sleep $((i * 10))
          done
          echo "could not start the next run"; exit 1
