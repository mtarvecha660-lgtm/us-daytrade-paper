name: tests
on:
  push:
    paths-ignore: ["live/state/**", "docs/data/**"]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.11"}
      - run: python -m unittest discover -s tests -v
      - run: python research/backtest.py --help
